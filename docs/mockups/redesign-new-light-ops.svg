<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6f4ef"/>
      <stop offset="1" stop-color="#e7f2ef"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1">
      <stop offset="0" stop-color="#10201f"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <style>
      .bg{fill:url(#bg)}
      .ink{fill:#101820;font-family:Inter,Segoe UI,Arial,sans-serif}
      .muted{fill:#66737a;font-family:Inter,Segoe UI,Arial,sans-serif}
      .teal{fill:#0f766e}
      .white{fill:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}
      .card{fill:#ffffff;stroke:#d9e2df}
      .soft{fill:#f4f8f7;stroke:#d9e2df}
      .dark{fill:#10201f}
      .green{fill:#15803d}.amber{fill:#b45309}.red{fill:#dc2626}.blue{fill:#2563eb}
      .xs{font-size:11px}.sm{font-size:12px}.base{font-size:14px}.md{font-size:16px}.lg{font-size:20px}.xl{font-size:30px}.xxl{font-size:42px}
      .bold{font-weight:700}.semi{font-weight:600}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <rect x="36" y="28" width="1528" height="70" rx="24" fill="#ffffff" stroke="#d9e2df"/>
  <text class="ink bold xl" x="64" y="74">ExtraSolutio</text>
  <text class="teal semi sm" x="248" y="74" font-family="Inter,Segoe UI,Arial">Staff &amp; Eventos</text>
  <g class="muted base">
    <text x="458" y="71">Dashboard</text>
    <text x="570" y="71">Calendário</text>
    <text x="690" y="71">Eventos</text>
    <text x="790" y="71">Clientes</text>
    <text x="884" y="71">Colaboradores</text>
    <text x="1032" y="71">Financeiro</text>
  </g>
  <rect x="1354" y="44" width="150" height="38" rx="19" fill="#10201f"/>
  <text class="white semi sm" x="1390" y="68">Nova ação</text>

  <g transform="translate(54,130)">
    <rect x="0" y="0" width="1492" height="166" rx="30" fill="url(#hero)"/>
    <text class="white bold xxl" x="34" y="62">Painel operacional</text>
    <text class="white md" x="36" y="98" opacity="0.82">Hoje tens 3 eventos, 7 colaboradores por confirmar e 18 horários por validar.</text>
    <rect x="1138" y="36" width="304" height="94" rx="22" fill="#ffffff" opacity="0.12"/>
    <text class="white sm" x="1164" y="66" opacity="0.82">Valor pronto para faturar</text>
    <text class="white bold xl" x="1164" y="106">1.284,00 €</text>
  </g>

  <g transform="translate(54,330)">
    <rect class="card" x="0" y="0" width="350" height="130" rx="22"/>
    <text class="muted sm" x="28" y="34">Eventos hoje</text>
    <text class="ink bold xxl" x="28" y="88">3</text>
    <text class="green sm" x="106" y="86" font-family="Inter,Segoe UI,Arial">+1 vs ontem</text>

    <rect class="card" x="380" y="0" width="350" height="130" rx="22"/>
    <text class="muted sm" x="408" y="34">Staff por confirmar</text>
    <text class="ink bold xxl" x="408" y="88">7</text>
    <text class="amber sm" x="486" y="86" font-family="Inter,Segoe UI,Arial">4 eventos afetados</text>

    <rect class="card" x="760" y="0" width="350" height="130" rx="22"/>
    <text class="muted sm" x="788" y="34">Horários por validar</text>
    <text class="ink bold xxl" x="788" y="88">18</text>
    <text class="blue sm" x="884" y="86" font-family="Inter,Segoe UI,Arial">abrir validação</text>

    <rect class="card" x="1140" y="0" width="350" height="130" rx="22"/>
    <text class="muted sm" x="1168" y="34">Eventos finalizados</text>
    <text class="ink bold xxl" x="1168" y="88">8</text>
    <text class="green sm" x="1246" y="86" font-family="Inter,Segoe UI,Arial">prontos</text>
  </g>

  <g transform="translate(54,494)">
    <rect class="card" x="0" y="0" width="930" height="338" rx="26"/>
    <text class="ink bold lg" x="30" y="42">Agenda operacional</text>
    <text class="teal semi sm" x="806" y="42" font-family="Inter,Segoe UI,Arial">Ver calendário</text>
    <line x1="0" x2="930" y1="62" y2="62" stroke="#d9e2df"/>
    <g transform="translate(30,92)">
      <rect class="soft" x="0" y="0" width="870" height="64" rx="18"/>
      <text class="ink semi md" x="22" y="28">Restaurante Luz Chakall</text>
      <text class="muted sm" x="22" y="50">11:30 - 16:00 · Equipa completa</text>
      <rect x="680" y="16" width="144" height="32" rx="16" fill="#dcfce7"/><text class="green sm" x="712" y="37" font-family="Inter,Segoe UI,Arial">Confirmado</text>
    </g>
    <g transform="translate(30,174)">
      <rect class="soft" x="0" y="0" width="870" height="64" rx="18"/>
      <text class="ink semi md" x="22" y="28">Embaixada da China</text>
      <text class="muted sm" x="22" y="50">18:00 - 23:00 · 2 por confirmar</text>
      <rect x="680" y="16" width="144" height="32" rx="16" fill="#fef3c7"/><text class="amber sm" x="710" y="37" font-family="Inter,Segoe UI,Arial">Atenção</text>
    </g>
    <g transform="translate(30,256)">
      <rect class="soft" x="0" y="0" width="870" height="64" rx="18"/>
      <text class="ink semi md" x="22" y="28">Casa Oeiras</text>
      <text class="muted sm" x="22" y="50">Restante pagamento vence hoje</text>
      <rect x="680" y="16" width="144" height="32" rx="16" fill="#fee2e2"/><text class="red sm" x="716" y="37" font-family="Inter,Segoe UI,Arial">Resolver</text>
    </g>

    <rect class="card" x="966" y="0" width="526" height="338" rx="26"/>
    <text class="ink bold lg" x="996" y="42">Ações pendentes</text>
    <text class="muted sm" x="996" y="78">Prioridade inteligente por prazo e impacto financeiro.</text>
    <rect x="996" y="112" width="466" height="58" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <text class="ink semi base" x="1018" y="137">Validar horários Cliente</text>
    <text class="amber sm" x="1018" y="158" font-family="Inter,Segoe UI,Arial">Restaurante Luz Chakall · Hoje</text>
    <rect x="996" y="188" width="466" height="58" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="ink semi base" x="1018" y="213">Enviar lembrete 24h</text>
    <text class="blue sm" x="1018" y="234" font-family="Inter,Segoe UI,Arial">Embaixada da China · Amanhã</text>
    <rect x="996" y="264" width="466" height="58" rx="16" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text class="ink semi base" x="1018" y="289">Serviço pronto para faturar</text>
    <text class="green sm" x="1018" y="310" font-family="Inter,Segoe UI,Arial">SSH · 1.284,00 €</text>
  </g>
</svg>
