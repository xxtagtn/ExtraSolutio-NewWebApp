      .text{fill:#eef5f3;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#94a3ad;font-family:Inter,Segoe UI,Arial,sans-serif}.cyan{fill:#67e8f9}.lime{fill:#bef264}.gold{fill:#facc15}.red{fill:#fb7185}.violet{fill:#c4b5fd}
      .xs{font-size:11px}.sm{font-size:12px}.base{font-size:14px}.md{font-size:16px}.lg{font-size:20px}.xl{font-size:30px}.xxl{font-size:42px}.bold{font-weight:700}.semi{font-weight:600}
    </style>
