<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg{fill:#071013}.panel{fill:#101b20;stroke:#22333b;stroke-width:1.2}.panel2{fill:#0c171b;stroke:#22333b;stroke-width:1}.text{fill:#e7f1f3;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#91a3aa}.accent{fill:#18c6b8}.green{fill:#123620;stroke:#2ac46a}.amber{fill:#2e210c;stroke:#c18414}.blue{fill:#0c2536;stroke:#1e6ba8}.red{fill:#351414;stroke:#c24141}.small{font-size:14px}.body{font-size:18px}.title{font-size:30px;font-weight:800}.h2{font-size:22px;font-weight:750}.bold{font-weight:750}.btn{fill:#12bdb0;rx:8;ry:8}.btn2{fill:#0b1519;stroke:#2a3e47;rx:8;ry:8}.line{stroke:#253942;stroke-width:1}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title text" x="34" y="58">Financeiro e Regras Automáticas</text>
  <text class="muted body" x="34" y="90">Separar previsão de processamento real, usando o cliente como origem das regras.</text>

  <rect class="panel" x="34" y="122" width="748" height="318" rx="10"/>
  <text class="h2 text" x="60" y="164">Cliente: SSH - Supreme Sport Hospitality</text>
  <text class="muted body" x="60" y="194">A ficha do cliente passa a comandar os defaults comerciais e operacionais.</text>
  <g transform="translate(60 224)">
    <rect class="panel2" x="0" y="0" width="210" height="78" rx="8"/>
    <text class="muted small" x="18" y="28">Método faturação</text><text class="text body bold" x="18" y="56">Mensal</text>
    <rect class="panel2" x="228" y="0" width="210" height="78" rx="8"/>
    <text class="muted small" x="246" y="28">Prazo pagamento</text><text class="text body bold" x="246" y="56">30 dias</text>
    <rect class="panel2" x="456" y="0" width="210" height="78" rx="8"/>
    <text class="muted small" x="474" y="28">Horas mínimas</text><text class="text body bold" x="474" y="56">4:00h por turno</text>
    <rect class="panel2" x="0" y="96" width="210" height="78" rx="8"/>
    <text class="muted small" x="18" y="124">Uniforme habitual</text><text class="text body bold" x="18" y="152">Camisa Preta</text>
    <rect class="panel2" x="228" y="96" width="210" height="78" rx="8"/>
    <text class="muted small" x="246" y="124">Contacto local</text><text class="text body bold" x="246" y="152">Inês Abreu</text>
    <rect class="panel2" x="456" y="96" width="210" height="78" rx="8"/>
    <text class="muted small" x="474" y="124">Pré-pagamento</text><text class="text body bold" x="474" y="152">Não aplicável</text>
  </g>
  <rect class="blue" x="60" y="414" width="678" height="22" rx="6"/>
  <text class="text small" x="78" y="430">Usado automaticamente em Orçamentos, Eventos/Serviços e Financeiro, mas sempre editável.</text>

  <rect class="panel" x="818" y="122" width="748" height="318" rx="10"/>
  <text class="h2 text" x="844" y="164">Checklist de conversão Orçamento → Evento</text>
  <text class="muted body" x="844" y="194">Antes de criar o evento, o sistema mostra o que foi transferido.</text>
  <g transform="translate(844 222)">
    <rect class="green" x="0" y="0" width="320" height="38" rx="8"/><text class="text body" x="18" y="25">✓ Valor transferido: 1.284,00€</text>
    <rect class="green" x="346" y="0" width="320" height="38" rx="8"/><text class="text body" x="364" y="25">✓ Deslocação: 55,00€</text>
    <rect class="green" x="0" y="52" width="320" height="38" rx="8"/><text class="text body" x="18" y="77">✓ Uniforme: Camisa Preta</text>
    <rect class="green" x="346" y="52" width="320" height="38" rx="8"/><text class="text body" x="364" y="77">✓ Cliente e local confirmados</text>
    <rect class="green" x="0" y="104" width="320" height="38" rx="8"/><text class="text body" x="18" y="129">✓ Funções: 8 colaboradores</text>
    <rect class="amber" x="346" y="104" width="320" height="38" rx="8"/><text class="text body" x="364" y="129">! Custos externos: 240,00€</text>
    <rect class="blue" x="0" y="156" width="320" height="38" rx="8"/><text class="text body" x="18" y="181">Pré-pagamento: 70% calculado</text>
    <rect class="btn" x="346" y="156" width="180" height="38"/><text class="text body bold" x="378" y="181" fill="#071013">Criar evento</text>
  </g>

  <rect class="panel" x="34" y="476" width="748" height="364" rx="10"/>
  <text class="h2 text" x="60" y="518">Financeiro só processa dados finalizados</text>
  <text class="muted body" x="60" y="548">A previsão fica visível, mas bloqueada para pagamento/faturação.</text>
  <g transform="translate(60 580)">
    <rect class="amber" x="0" y="0" width="300" height="92" rx="8"/>
    <text class="muted small" x="18" y="28">Previsão</text><text class="text h2" x="18" y="58">Por validar horários</text><text class="text small" x="18" y="80">Sem botões de pagar/faturar</text>
    <rect class="green" x="326" y="0" width="300" height="92" rx="8"/>
    <text class="muted small" x="344" y="28">Processável</text><text class="text h2" x="344" y="58">Evento finalizado</text><text class="text small" x="344" y="80">Pagamentos e faturas ativos</text>
  </g>
  <rect class="panel2" x="60" y="704" width="676" height="104" rx="8"/>
  <text class="muted small" x="82" y="734">Evento</text><text class="muted small" x="318" y="734">Estado</text><text class="muted small" x="520" y="734">Ação</text>
  <line class="line" x1="60" y1="748" x2="736" y2="748"/>
  <text class="text body" x="82" y="779">Restaurante Luz Chakall</text>
  <rect class="green" x="318" y="758" width="120" height="28" rx="8"/><text class="text small" x="340" y="777">Finalizado</text>
  <rect class="btn" x="520" y="756" width="150" height="32"/><text class="text small bold" x="552" y="777" fill="#071013">Processar</text>

  <rect class="panel" x="818" y="476" width="748" height="364" rx="10"/>
  <text class="h2 text" x="844" y="518">Processamento mensal de Staff</text>
  <text class="muted body" x="844" y="548">Lote “Julho 08-14”: rever, ajustar, pagar em massa e arquivar.</text>
  <g transform="translate(844 580)">
    <rect class="panel2" x="0" y="0" width="666" height="58" rx="8"/>
    <text class="text body bold" x="18" y="36">Processamento Julho</text>
    <text class="muted body" x="250" y="36">08/07 a 14/07</text>
    <text class="accent body bold" x="472" y="36">Total: 13.420,00€</text>
    <rect class="panel2" x="0" y="86" width="666" height="170" rx="8"/>
    <text class="muted small" x="18" y="116">Colaborador</text><text class="muted small" x="246" y="116">Horas</text><text class="muted small" x="338" y="116">Ajustes</text><text class="muted small" x="462" y="116">Total</text><text class="muted small" x="560" y="116">Estado</text>
    <line class="line" x1="0" y1="130" x2="666" y2="130"/>
    <text class="text body" x="18" y="160">Miriam Peçanha</text><text class="text body" x="246" y="160">42:30h</text><text class="text body" x="338" y="160">+2,50€</text><text class="text body bold" x="462" y="160">342,50€</text><rect class="amber" x="560" y="140" width="80" height="28" rx="8"/><text class="text small" x="578" y="159">Por pagar</text>
    <text class="text body" x="18" y="204">Leonardo Lima</text><text class="text body" x="246" y="204">38:00h</text><text class="text body" x="338" y="204">-5,00€</text><text class="text body bold" x="462" y="204">299,00€</text><rect class="green" x="560" y="184" width="62" height="28" rx="8"/><text class="text small" x="580" y="203">Pago</text>
    <rect class="btn2" x="0" y="278" width="152" height="42"/><text class="text small" x="28" y="304">Selecionar todos</text>
    <rect class="btn" x="170" y="278" width="152" height="42"/><text class="text small bold" x="202" y="304" fill="#071013">Mover pagos</text>
    <rect class="btn2" x="340" y="278" width="152" height="42"/><text class="text small" x="368" y="304">Arquivar lote</text>
  </g>
</svg>
