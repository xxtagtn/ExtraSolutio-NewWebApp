      .muted{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#a9bac0}
      .green{fill:#86efac}.teal{fill:#2dd4bf}.amber{fill:#fbbf24}.red{fill:#fb7185}.blue{fill:#93c5fd}
      .xs{font-size:11px}.sm{font-size:12px}.base{font-size:14px}.md{font-size:16px}.lg{font-size:20px}.xl{font-size:28px}.xxl{font-size:38px}
