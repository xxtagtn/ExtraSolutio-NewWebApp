      .xs{font-size:11px}.sm{font-size:12px}.base{font-size:14px}.md{font-size:16px}.lg{font-size:20px}.xl{font-size:30px}.xxl{font-size:42px}.bold{font-weight:700}.semi{font-weight:600}
