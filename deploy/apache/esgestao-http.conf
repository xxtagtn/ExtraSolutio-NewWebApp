# Replace the existing port-80 VirtualHost, not the TLS/Certbot configuration.
<VirtualHost *:80>
    ServerName esgestao.ddns.net
    RewriteEngine On
    # Fixed destination host; 308 preserves methods, paths and query strings.
    RewriteRule ^ https://esgestao.ddns.net%{REQUEST_URI} [R=308,L,NE]
</VirtualHost>
