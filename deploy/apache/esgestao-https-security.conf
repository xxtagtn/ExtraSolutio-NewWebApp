# Include INSIDE the existing, working *:443 VirtualHost.
# Keep its certificates, /api proxy, SPA rewrites and PWA cache configuration.
Header always set Strict-Transport-Security "max-age=86400"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Block old static URLs even when an old build or Alias still has the files.
# Authenticated images now use /api/uploads/collaborators/...
<LocationMatch "^/uploads(?:/|$)">
    Require all denied
</LocationMatch>
